name: Android Build
on:
  push:
    branches: [ "main", "master" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v7

      #- name: Install Android dependencies
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865"

      - name: Configure CMake and Generate Android Project files
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTHE_ENGINE_BUILD_TESTS=ON -DTHE_ENGINE_ANDROID_TEST=ON


      - name: Change folder to generated Android project folder
        run: cd tests/compile/android/

      - name: Build the Project
        run: ./gradlew --no-daemon build

